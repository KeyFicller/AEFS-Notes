    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 14px;
  }
  figure { margin: 0; }
  figure a {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  figure a:hover {
    transform: translateY(-2px);
    border-color: #b9ad93;
    box-shadow: 0 6px 18px rgba(80, 68, 48, .16);
  }
  figure img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #fff;
  }

    margin-top: 6px;
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #empty { display: none; padding: 40px 0; color: var(--muted); }
  /* 灯箱 */
  #box {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(24, 21, 16, .88);
    backdrop-filter: blur(3px);
  }
  #box.on { display: flex; }
  #box img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    background: #fff;
  }
  #box .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    color: #e8e2d4;
    font-size: 12.5px;
    pointer-events: none;
  }
  #box .bar b { font-weight: 600; color: #fff; }
  #box button {
    pointer-events: auto;
    font: inherit;
    color: #e8e2d4;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
  }
  #box button:hover { background: rgba(255, 255, 255, .22); }
  #prev, #next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    line-height: 1;
    padding: 14px 16px;
  }
  #prev { left: 16px; }
  #next { right: 16px; }

function strip(s) { return s.replace(/^\d+[-_]/, "").replace(/[-_]/g, " "); }
function split(path) {
  const i = path.lastIndexOf("/");
  return { dir: path.slice(0, i), file: path.slice(i + 1) };
}

const phases = new Map();
for (const path of CARDS) {
  const { dir } = split(path);
  if (!phases.has(dir)) phases.set(dir, []);
  phases.get(dir).push(path);
}

const main = document.getElementById("main");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const qEl = document.getElementById("q");
const box = document.getElementById("box");
const boxImg = document.getElementById("box-img");
const boxTitle = document.getElementById("box-title");
const boxMeta = document.getElementById("box-meta");

let visible = [];   // 当前可见的卡片，灯箱左右键按这个顺序走
let current = -1;

const frag = document.createDocumentFragment();
phases.forEach((paths, dir) => {
  const section = document.createElement("section");
  const h2 = document.createElement("h2");
  h2.textContent = strip(dir);
  const em = document.createElement("em");
  em.textContent = paths.length + " 张";
  h2.appendChild(em);
  section.appendChild(h2);

  const grid = document.createElement("div");
  grid.className = "grid";
  for (const path of paths) {
    const { file } = split(path);
    const fig = document.createElement("figure");
    fig.dataset.key = path.toLowerCase();
    const a = document.createElement("a");
    a.href = "#" + path;
    const img = document.createElement("img");
    img.src = path;
    img.alt = strip(file.replace(/\.png$/i, ""));
    img.loading = "lazy";      // 506 张共 228MB，不懒加载会卡死
    img.decoding = "async";
    a.appendChild(img);
    const cap = document.createElement("figcaption");
    cap.textContent = img.alt;
    a.addEventListener("click", (e) => { e.preventDefault(); open(path); });
    fig.appendChild(a);
    fig.appendChild(cap);
    grid.appendChild(fig);
  }
  section.appendChild(grid);
  frag.appendChild(section);
});
main.appendChild(frag);

function open(path) {
  visible = [...document.querySelectorAll("figure")]
    .filter((f) => f.style.display !== "none")
    .map((f) => f.querySelector("img").getAttribute("src"));
  current = visible.indexOf(path);
  paint();
  box.classList.add("on");
}
function paint() {
  if (current < 0 || current >= visible.length) return;
  const path = visible[current];
  const { file } = split(path);
  boxImg.src = path;
  boxTitle.textContent = strip(file.replace(/\.png$/i, ""));
  boxMeta.textContent = " · " + (current + 1) + " / " + visible.length;
}
function close() {
  box.classList.remove("on");
  boxImg.removeAttribute("src");
}
function step(d) {
  if (!visible.length) return;
  current = (current + d + visible.length) % visible.length;
  paint();
}

document.getElementById("close").addEventListener("click", close);
document.getElementById("prev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
document.getElementById("next").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
box.addEventListener("click", (e) => { if (e.target === box) close(); });
document.addEventListener("keydown", (e) => {
  if (!box.classList.contains("on")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

function applyFilter() {
  const q = qEl.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section").forEach((section) => {
    let inSection = 0;
    section.querySelectorAll("figure").forEach((fig) => {
      const hit = !q || fig.dataset.key.includes(q);
      fig.style.display = hit ? "" : "none";
      if (hit) inSection++;
    });
    section.style.display = inSection ? "" : "none";
    shown += inSection;
  });
  countEl.textContent = q ? shown + " / " + CARDS.length + " 张" : CARDS.length + " 张";
  emptyEl.style.display = shown ? "none" : "block";
}
qEl.addEventListener("input", applyFilter);
applyFilter();

// 深链：#notes/cards/14-agent-engineering/… 或直接 #14-agent-engineering/xxx.png
if (location.hash.length > 1) {
  const want = decodeURIComponent(location.hash.slice(1));
  if (CARDS.includes(want)) open(want);
}
</script>
